<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snake Game</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <h1>Snake Game</h1>
    <p class="hint">Use arrow keys or WASD to move. Press Space to restart.</p>
    <div class="hud">
      <span>Score: <strong id="score">0</strong></span>
      <span>Best: <strong id="best">0</strong></span>
    </div>
    <canvas id="game" width="400" height="400" aria-label="Snake game board"></canvas>
    <p id="status" class="status">Collect the food!</p>
  </main>
  <script src="game.js"></script>
</body>
</html>
